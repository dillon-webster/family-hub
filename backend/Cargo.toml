[package]
name = "family-hub-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15.7"
futures = "0.3.33"
icalendar = { version = "0.17.13", features = ["chrono-tz"] }
# rustls rather than the system OpenSSL: keeps the runtime image free of a
# native TLS dependency, which matters for the slim Debian stage.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "gzip", "brotli"] }
rrule = "0.14.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[profile.release]
# The kiosk runs one binary forever; trade build time for a smaller, faster image.
lto = "thin"
codegen-units = 1
strip = true
